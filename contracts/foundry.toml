# 资金归集合约（以太坊、BSC）。
# 编译参数和 BitGo eth-multisig-v4 的 hardhat.config.ts 一致：solc 0.8.20、evmVersion paris、优化器 1000 次。
# BitGo 和 OpenZeppelin 的源码在 lib/ 下原样保存（来源提交号和 sha256 见 README.md、lib/SHA256SUMS），一行不改。
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 1000
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "bitgo/=lib/eth-multisig-v4/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# CREATE2 测试向量放在后端的测试资源里，后端（test/wallet-create2.test.js）和 Foundry（test/Vectors.t.sol）读同一份文件
fs_permissions = [{ access = "read", path = "../test/fixtures/wallet" }]

# TRON 派生版合约（src/tron/）的单测放在 test-tron/，单独一个 profile：FOUNDRY_PROFILE=tron forge test
# 编译参数和上面一致；默认 profile 不编译 test-tron/，TRON 版的测试红了不会连带以太坊版的测试
[profile.tron]
src = "src"
test = "test-tron"
script = "script"
out = "out-tron-forge"
cache_path = "cache-tron-forge"
libs = ["lib"]
solc_version = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 1000
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "bitgo/=lib/eth-multisig-v4/contracts/",
  "forge-std/=lib/forge-std/src/",
]

# 批量打款合约 BatchPayout（第 3 批）的单测、模糊、不变量放在 test-payout/，单独一个 profile：FOUNDRY_PROFILE=payout forge test
# 和 tron 一样分开：合约还没写时这里编译失败，不连带默认 profile 的归集合约测试；覆盖率用 script/check-coverage.sh 卡 100%
[profile.payout]
src = "src"
test = "test-payout"
script = "test-payout" # 不编译 script/：forge coverage 分析带中文注释的部署脚本会崩（forge 1.3.5 实测），打款测试也用不到脚本
out = "out-payout"
cache_path = "cache-payout"
libs = ["lib"]
solc_version = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 1000
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "bitgo/=lib/eth-multisig-v4/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
# 每个模糊测试至少 10,000 次
runs = 10000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
