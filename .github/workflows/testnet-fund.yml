# 测试网充值（scripts/testnet/README.md 第 5 节）：归集手续费对比验收要"每条链 N 个新充值地址、每个打 100 个测试 USDT"，这个流程代替人工一笔笔转账。
#   第 1 步 addresses（GitHub 环境 staging-e2e，要管理员批准）：测试商户的开放 API 在测试环境建 N 个客户、生成充值地址（scripts/testnet/fund-addresses.mjs），
#     只输出客户标识和公开地址
#   第 2 步 fund（GitHub 环境 testnet，要管理员批准）：部署账户给这些地址各转 AMOUNT 个测试 USDT（scripts/testnet/fund-send.mjs），
#     只准 Sepolia（链 ID 11155111）和 Nile、只准 staging 的测试 USDT、每条链最多 50 个地址、每个最多 1000 个；地址只来自第 1 步（或手动运行时填的清单）
#   不碰主网、不改 config/wallets.json；结果（客户标识、地址、交易号）写进运行摘要和产物，没有密钥、没有商户名
# 触发：在 Actions 页面手动运行（这个文件进了默认分支之后才有按钮），或推送到 testnet-fund/ 开头的分支（不用先进默认分支，参数用仓库变量或默认值）。
#   推送触发要管理员先在两个环境（staging-e2e、testnet）的 Deployment branches 里加 testnet-fund/**；job 上的 if 只是防手误，安全边界是两个环境的 Required reviewers
# 批准前必看：批准一次 testnet-fund/* 分支上的运行 = 让这个分支上的任何代码（包括被改过的这个流程文件和脚本）拿到 staging-e2e 或 testnet 的密钥。
#   批准前先看这个分支相对 staging 的改动（GitHub 上 compare staging...testnet-fund/<名字>，应该一个文件都没改）；testnet-fund/ 分支只从最新的 staging 拉、不在上面改代码。
# 副作用（共用的 staging 测试商户）：每次运行每条链多 N 个客户（eth,tron 就是 2×N 个，客户标识 fee-ac3-…）；测试商户开了订单模式时还会多 N 张待付款订单，
#   打币后订单被匹配，配了回调地址的话会发 order.matched 回调；打了币的地址会被定时凑批或 staging-e2e 的 E09 凑进归集批次（E09 凑出后会作废放回）。详见 README 第 5 节
name: testnet-fund
on:
  workflow_dispatch:
    inputs:
      chains:
        description: 哪几条链
        type: choice
        options: ['eth,tron', 'eth', 'tron']
        default: 'eth,tron'
      count:
        description: 每条链几个新地址（1～50）
        required: false
        default: '20'
      amount:
        description: 每个地址打多少个测试 USDT（最多 1000）
        required: false
        default: '100'
      addresses:
        description: （可选）不建新地址、直接给这些地址打币（空格或逗号分隔；只能选一条链）。空着走第 1 步
        required: false
        default: ''
  push:
    branches: ['testnet-fund/**']
permissions:
  contents: read
concurrency:
  group: testnet-fund
  cancel-in-progress: false
jobs:
  addresses:
    if: (github.ref == 'refs/heads/staging' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/testnet-fund/'))) && inputs.addresses == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging-e2e
    outputs:
      plan: ${{ steps.collect.outputs.plan }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5（v5.1.0）
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5（v5.0.0）
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      # 参数都经过环境变量传给脚本（不拼进命令行）；客户标识 fee-ac3-<链>-<运行号>-<序号>
      - name: 建客户、生成充值地址
        id: collect
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          STAGING_E2E_MERCHANT_KEY: ${{ secrets.STAGING_E2E_MERCHANT_KEY }}
          STAGING_E2E_MERCHANT_SECRET: ${{ secrets.STAGING_E2E_MERCHANT_SECRET }}
          FUND_CHAINS: ${{ inputs.chains || vars.TESTNET_FUND_CHAINS || 'eth,tron' }}
          FUND_COUNT: ${{ inputs.count || vars.TESTNET_FUND_COUNT || '20' }}
          FUND_AMOUNT: ${{ inputs.amount || vars.TESTNET_FUND_AMOUNT || '100' }}
          FUND_RUN: ${{ github.run_id }}
          OUT_DIR: testnet-fund
        run: node scripts/testnet/fund-addresses.mjs
      - name: 保存地址清单（只有客户标识和公开地址）
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5（v5.0.0）
        with:
          name: testnet-fund-addresses
          path: testnet-fund/
          if-no-files-found: ignore
          retention-days: 90
  fund:
    needs: addresses
    # 第 1 步成功，或手动运行时填了地址清单（第 1 步跳过）
    if: ${{ !cancelled() && (github.ref == 'refs/heads/staging' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/testnet-fund/'))) && (needs.addresses.result == 'success' || (needs.addresses.result == 'skipped' && inputs.addresses != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: testnet
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5（v5.1.0）
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5（v5.0.0）
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      # 私钥只给这一步；地址清单是第 1 步的输出（公开地址），脚本整份核对后才发
      - name: 转测试 USDT 并核对到账
        env:
          TOPUP_TESTNET_DEPLOYER_KEY: ${{ secrets.TOPUP_TESTNET_DEPLOYER_KEY }}
          TESTNET_ETH_RPC_URL: ${{ secrets.TESTNET_ETH_RPC_URL }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          EVM_GAS_PRICE_GWEI: ${{ vars.TESTNET_EVM_GAS_PRICE_GWEI }}
          FUND_PLAN: ${{ needs.addresses.outputs.plan }}
          FUND_ADDRESSES: ${{ inputs.addresses }}
          FUND_CHAINS: ${{ inputs.chains }}
          FUND_AMOUNT: ${{ inputs.amount || '100' }}
          FUND_RUN: ${{ github.run_id }}
          OUT_DIR: testnet-fund
        run: node scripts/testnet/fund-send.mjs
      - name: 保存结果（客户标识、地址、交易号）
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5（v5.0.0）
        with:
          name: testnet-fund-result
          path: testnet-fund/
          if-no-files-found: ignore
          retention-days: 90
