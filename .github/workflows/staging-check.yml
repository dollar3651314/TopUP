# 测试环境（staging）检查的手动入口：在 Actions 页面手动运行，等测试服务器部署 staging 的最新提交，再执行 e2e/smoke-staging.sh。
# 合并到 staging 后的自动检查在 ci.yml 的 staging-smoke（镜像推送之后才开始等，不会在 CI 还没跑完时就超时）。
# 测试环境的地址放在仓库的 Actions Secrets（STAGING_URL），不写在仓库里、日志里自动遮盖；没有配置时跳过。
name: staging-check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-check
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_URL: ${{ secrets.STAGING_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5（v5.1.0）
        with:
          persist-credentials: false
      - name: 测试环境检查
        run: |
          if [ -z "$STAGING_URL" ]; then echo "::warning::仓库密钥 STAGING_URL 还没有配置，跳过"; exit 0; fi
          bash e2e/smoke-staging.sh "$STAGING_URL" "${GITHUB_SHA::7}"
