# 测试环境（staging）真实验收用例：用测试管理员（server/pay/test-admin.js）对测试环境跑 e2e/staging-e2e/ 里的用例。
#   - 两种触发：
#     ① 手动：Actions 页面选 staging-e2e → Run workflow（分支选 staging），或 gh workflow run staging-e2e.yml --ref staging。
#        GitHub 只在流程文件已经在默认分支（main）上时才给手动触发，进 main 之前这条走不通（返回 404）
#     ② 推送到 e2e-run/ 开头的分支（和 testnet-deploy.yml 的 testnet-run/** 同一个办法，不用先进 main）：从最新的 staging 拉一个
#        e2e-run/<名字> 分支推上去就跑；只跑部分用例时在这个分支里放 e2e/staging-e2e/run-files.txt（空白分隔的用例文件，格式和手动的 files 一样，
#        run.mjs 同样核对）；没有这个文件跑全部。这是临时的：推送触发让没合并的代码也能拿到令牌（只剩审批一道），
#        只含这个流程文件的 PR 进了 main 后，下一个往 staging 的 PR 就删掉它（环境里 e2e-run/** 的分支规则也一起删）
#   - 真正的关卡是 GitHub 环境 staging-e2e 的 Required reviewers（管理员在仓库设置里配，每次运行由管理员看过这次的提交再点批准，密钥才会交给这次运行）。
#     环境的 Deployment branches 只允许 staging 和 e2e-run/**；能推 e2e-run/** 分支的人连这个流程文件都能改，所以分支限制和下面 job 上的 if
#     都只是防手误，不是安全边界。智能体不批准部署，推送触发后把运行链接交给管理员批准
#   - 令牌是这个环境的密钥 STAGING_TEST_ADMIN_TOKEN（管理员在服务器上 sudo topup gen-test-admin 生成后自己填）。日志里 GitHub 会遮盖原文，
#     但合并进 staging 的用例代码能在运行时读到它（lib.mjs 读完就从环境里删，挡不住故意的代码）：靠审批和定期换令牌
#   - 可选：测试商户的开放 API Key（STAGING_E2E_MERCHANT_KEY、STAGING_E2E_MERCHANT_SECRET，同一个环境的密钥），用例用它造打款单；没填时这类用例跳过
#   - 仓库公开，运行日志谁都能看：用例只输出通过 / 失败和错误码，不输出接口返回的内容；不上传报告
#   - 用例只到"待签名"为止：签名一律由管理员在浏览器里做，测试管理员不能签名、不能改钱包设置
name: staging-e2e
on:
  workflow_dispatch:
    inputs:
      files:
        description: 只跑这些用例文件（空格分隔，例如 e2e/staging-e2e/basics.test.mjs；空着跑全部）
        required: false
        default: ''
  push:
    branches: ['e2e-run/**']
permissions:
  contents: read
concurrency:
  group: staging-e2e
  cancel-in-progress: false
jobs:
  e2e:
    # 防手误（不是安全边界）：推送 e2e-run/** 分支的人连这个流程文件都能改。安全边界是环境 staging-e2e 的 Required reviewers（管理员批准前看这次的提交）
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/e2e-run/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging-e2e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5（v5.1.0）
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5（v5.0.0）
        with:
          node-version: 26
      # 用例只用 Node 自带的 fetch 和 node:test，不装依赖；用例文件名在 run.mjs 里核对（只认 e2e/staging-e2e/*.test.mjs）
      - name: 跑测试环境验收用例
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          STAGING_TEST_ADMIN_TOKEN: ${{ secrets.STAGING_TEST_ADMIN_TOKEN }}
          STAGING_E2E_MERCHANT_KEY: ${{ secrets.STAGING_E2E_MERCHANT_KEY }}
          STAGING_E2E_MERCHANT_SECRET: ${{ secrets.STAGING_E2E_MERCHANT_SECRET }}
          FILES: ${{ inputs.files }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$STAGING_URL" ] || [ -z "$STAGING_TEST_ADMIN_TOKEN" ]; then
            echo "::error::GitHub 环境 staging-e2e 的密钥 STAGING_TEST_ADMIN_TOKEN（或仓库密钥 STAGING_URL）还没有配置"; exit 1
          fi
          # 推送触发：用例文件清单在分支里的 e2e/staging-e2e/run-files.txt（没有就跑全部）
          if [ "$EVENT" = push ] && [ -f e2e/staging-e2e/run-files.txt ]; then FILES=$(tr -s '[:space:]' ' ' < e2e/staging-e2e/run-files.txt); fi
          # FILES 只按空白拆开当文件名传给 run.mjs（run.mjs 只认 e2e/staging-e2e/*.test.mjs），不经过 shell 展开
          read -r -a files <<< "$FILES"
          node e2e/staging-e2e/run.mjs "${files[@]}"
